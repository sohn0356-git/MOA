name: Deploy Realtime Database Rules

on:
  push:
    branches:
      - main
    paths:
      - database.rules.json
      - firebase.json
      - firebase.rules-test.json
      - scripts/test-*-rules.mjs
      - .github/workflows/deploy-database-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java for database emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test suggestion permissions in the database emulator
        env:
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_fetch_retries: '1'
          npm_config_fetch_timeout: '30000'
        run: npx firebase-tools@latest emulators:exec --only database --project demo-moa --config firebase.rules-test.json "node scripts/test-suggestion-rules.mjs && node scripts/test-question-rules.mjs && node scripts/test-ai-city-rules.mjs"

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy database rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@latest deploy --only database --project "$FIREBASE_PROJECT_ID" --non-interactive

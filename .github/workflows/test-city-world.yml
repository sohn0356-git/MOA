name: Verify AI City browser layouts
on:
  push:
    branches: [main]
    paths:
      - 'src/apps/ai-city/**'
      - 'src/components/AuthGate*'
      - 'scripts/test-city-world-browser.mjs'
      - '.github/workflows/test-city-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: city-browser
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_fetch_retries: '1'
      npm_config_fetch_timeout: '30000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 3
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-city-world-browser.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-city-browser-screenshots
          path: city-browser-artifacts

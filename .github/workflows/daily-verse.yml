name: Update Daily Meditation Verse

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      update_date:
        description: 'KST date to write, formatted YYYY-MM-DD. Defaults to today in Korea.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Update Firebase verse
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          UPDATE_DATE: ${{ inputs.update_date }}
        run: node scripts/update-daily-verse.mjs
        working-directory: functions

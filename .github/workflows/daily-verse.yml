name: Update Daily Meditation Verse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-verse.yml'
      - 'functions/scripts/update-daily-verse.mjs'
      - 'scripts/test-daily-verse.mjs'
  schedule:
    # UTC 14:00-16:55 = KST 23:00-01:55: retry around the date change.
    - cron: '*/5 14-16 * * *'
    # Recover later if the source or GitHub scheduler was unavailable overnight.
    - cron: '17 0-13,17-23 * * *'
  workflow_dispatch:
    inputs:
      update_date:
        description: 'KST date to write, formatted YYYY-MM-DD. Defaults to today in Korea.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-verse
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Test daily verse updater
        run: node scripts/test-daily-verse.mjs

      - name: Update Firebase verse
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          UPDATE_DATE: ${{ inputs.update_date }}
        # Retry transient source/Firebase failures without waiting for another cron.
        # Bound each attempt so a stalled request cannot consume the entire job.
        run: |
          for attempt in 1 2 3 4 5; do
            if timeout 90s node scripts/update-daily-verse.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Daily verse update failed after 5 attempts."
              exit 1
            fi
            echo "::warning::Attempt $attempt failed; retrying in 60 seconds."
            sleep 60
          done
        working-directory: functions

      - name: Commit scripture cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scripture
          if git diff --cached --quiet; then
            echo "Scripture cache already up to date."
          else
            git commit -m "Update scripture cache"
            git push
          fi

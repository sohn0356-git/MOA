name: Faith gallery and draft checks
on:
  push:
    branches: [codex/faith-gallery-and-drafts]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:faith-startup
      - run: npm install --no-save --package-lock=false playwright
      - run: node scripts/test-faith-gallery.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: faith-gallery-screenshots
          path: test-results/faith-gallery
          if-no-files-found: ignore

name: Faith gallery and draft checks
on:
  push:
    branches: [codex/faith-gallery-and-drafts]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-moa.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-moa
      VITE_FIREBASE_STORAGE_BUCKET: demo-moa.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      VITE_FIREBASE_APP_ID: '1:1234567890:web:demo'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test shared devotion image permissions
        run: npx firebase-tools@latest emulators:exec --only database --project demo-moa --config firebase.rules-test.json "node scripts/test-devotion-image-rules.mjs && node scripts/test-sanctuary-rules.mjs"
      - run: npm run build
      - name: Compare boot assets against the previous multi-app build
        env:
          MOA_BOOT_BASELINE: ${{ runner.temp }}/moa-boot-baseline
        run: |
          git fetch --depth=1 origin f1036d8541541675369d70ae8c2ed1c4ead0c403
          git worktree add --detach "$MOA_BOOT_BASELINE" f1036d8541541675369d70ae8c2ed1c4ead0c403
          ln -s "$GITHUB_WORKSPACE/node_modules" "$MOA_BOOT_BASELINE/node_modules"
          npm --prefix "$MOA_BOOT_BASELINE" run build > "$RUNNER_TEMP/moa-boot-baseline.log" 2>&1
          node scripts/test-faith-only-build.mjs
      - run: npm test
      - run: npm run test:faith-startup
      - run: npm install --no-save --package-lock=false playwright
      - run: node scripts/test-faith-only-browser.mjs
      - name: Verify chapel launch and Google login progress
        run: node scripts/test-moa-launch.mjs
      - name: Verify durable login across browser restarts
        run: npx firebase-tools@latest emulators:exec --only auth --project demo-moa --config firebase.auth-test.json "node scripts/test-faith-session.mjs"
      - run: node scripts/test-faith-gallery.mjs
      - run: node scripts/test-faith-author-photo.mjs
      - name: Verify bilingual scripture and end-of-reading writing
        run: node scripts/test-faith-reading.mjs
      - run: node scripts/test-faith-sanctuary.mjs
      - name: Verify Pages M4A playback without Storage traffic
        run: node scripts/test-sanctuary-audio.mjs
      - name: Verify two-account sanctuary community
        run: npx firebase-tools@latest emulators:exec --only auth,database --project demo-moa --config firebase.sanctuary-test.json "node scripts/test-sanctuary-community.mjs"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: faith-gallery-screenshots
          path: |
            test-results/faith-boot
            test-results/faith-gallery
            test-results/faith-sanctuary
          if-no-files-found: ignore

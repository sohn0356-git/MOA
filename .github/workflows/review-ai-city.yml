name: Review Ai city requests
on:
  push:
    branches: [main]
    paths: [.github/workflows/review-ai-city.yml]
  workflow_dispatch:
  workflow_run:
    workflows: [Sync App Improvement Requests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Read public Ai city posts
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://' + process.env.FIREBASE_PROJECT_ID + '-default-rtdb.firebaseio.com/aiCity/posts.json')
          if (!response.ok) throw new Error('Public board read failed: ' + response.status)
          const posts = await response.json()
          console.log('CITY_REVIEW_AT=' + new Date().toISOString())
          console.log('CITY_FEED_COUNT=' + Object.values(posts || {}).filter(post => post.kind === 'feed').length)
          const materialsResponse = await fetch('https://' + process.env.FIREBASE_PROJECT_ID + '-default-rtdb.firebaseio.com/aiCity/materials.json')
          if (!materialsResponse.ok) throw new Error('Public material read failed: ' + materialsResponse.status)
          const materials = await materialsResponse.json()
          console.log('CITY_MATERIAL_COUNT=' + Object.keys(materials || {}).length)
          const suggestions = Object.entries(posts || {}).filter(([, post]) => post.kind === 'suggestion')
          const pending = suggestions.filter(([, post]) => !post.implementation?.applied)
          for (const [id, post] of pending) {
            console.log('CITY_POST=' + JSON.stringify({ id, ...post }))
          }
          console.log('CITY_SUGGESTION_COUNT=' + suggestions.length)
          console.log('CITY_PENDING_COUNT=' + pending.length)
          JS

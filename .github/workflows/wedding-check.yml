name: Wedding planner checks
on:
  push:
    branches: [codex/wedding-planner]
  pull_request:
    paths: ['src/apps/wedding/**', 'src/apps/registry.ts']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-wedding-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wedding-browser-artifacts
          path: wedding-browser-artifacts

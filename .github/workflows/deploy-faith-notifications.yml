name: Deploy Faith Notifications
on:
  push:
    branches: [main]
    paths:
      - functions/src/faithNotifications.ts
      - functions/src/notificationLogic.ts
      - functions/package.json
      - functions/package-lock.json
      - scripts/test-faith-notification-logic.mjs
      - functions/scripts/mark-faith-notifications-ready.mjs
      - functions/scripts/check-faith-notification-services.mjs
      - functions/scripts/deploy-faith-notifications.cjs
      - .github/workflows/deploy-faith-notifications.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faith-notifications
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: npm --prefix functions run build
      - run: node scripts/test-faith-notification-logic.mjs
      - name: Write deployment identity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/faith-notifications-service-account.json"
      - name: Install deployment CLI
        run: npm install --prefix "$RUNNER_TEMP/faith-firebase-cli" --no-audit --no-fund firebase-tools@latest
      - name: Deploy notification handlers and reminder schedule
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/faith-notifications-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_CLI_ROOT: ${{ runner.temp }}/faith-firebase-cli/node_modules/firebase-tools
        run: node functions/scripts/deploy-faith-notifications.cjs
      - name: Verify scheduler and enable reminder settings
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/faith-notifications-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: node functions/scripts/mark-faith-notifications-ready.mjs
      - name: Diagnose actual notification API access on failure
        if: failure()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/faith-notifications-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: node functions/scripts/check-faith-notification-services.mjs
      - name: Remove deployment identity
        if: always()
        run: rm -f "$RUNNER_TEMP/faith-notifications-service-account.json"

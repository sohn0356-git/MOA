name: Sync App Improvement Requests
on:
  push:
    branches: [main]
    paths:
      - docs/improvements.json
      - functions/scripts/sync-improvements.mjs
      - .github/workflows/sync-improvements.yml
  workflow_run:
    workflows: ["Deploy to GitHub Pages", "Deploy Realtime Database Rules"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: sync-improvements
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - name: Verify application and rules deployment for this commit
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('verified', 'false')
              return
            }
            const sha = context.payload.workflow_run.head_sha
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: sha, per_page: 100
            })
            const pages = data.workflow_runs.find(run => run.name === 'Deploy to GitHub Pages')
            const rules = data.workflow_runs.find(run => run.name === 'Deploy Realtime Database Rules')
            core.setOutput('verified', String(pages?.conclusion === 'success' && (!rules || rules.conclusion === 'success')))

      - name: Register requests and check verified improvements
        run: node scripts/sync-improvements.mjs
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VERIFIED_DEPLOY: ${{ steps.verify.outputs.verified == 'true' }}

      - name: Apply reviewed Ai city requests after verified deployment
        if: steps.verify.outputs.verified == 'true'
        run: node scripts/sync-ai-city.mjs
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VERIFIED_DEPLOY: 'true'
          VERIFIED_COMMIT: ${{ github.event.workflow_run.head_sha }}

name: Faith entry checks
on:
  push:
    branches: [codex/faith-default-entry, codex/faith-login-controls]
  pull_request:
    paths: ['src/app/**', 'src/apps/meditation/**']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:faith-startup
